<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Peludinhos - Perfil</title>
    <link href="https://fonts.googleapis.com" rel="preconnect">
    <link crossorigin href="https://fonts.gstatic.com" rel="preconnect">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/output.css">
    <link href="https://cdn.jsdelivr.net/npm/remixicon@4.2.0/fonts/remixicon.css" rel="stylesheet">
</head>
<body class="min-h-screen flex flex-col bg-gray-100 text-gray-800">
  <div class="w-full max-w-sm mx-auto min-h-screen flex flex-col font-sans bg-surface relative shadow-2xl bg-gray-50">
    <header class="bg-brand-teal text-white z-20 relative pt-12 pb-24 px-4 rounded-b-[2.5rem] shadow-md flex flex-col gap-4">
        <div class="flex items-center justify-between">
            <button aria-label="Menu" class="text-2xl p-1">
                <i class="ri-menu-line"></i>
            </button>
            <div class="flex items-center gap-2 absolute left-1/2 -translate-x-1/2">
                <img src="../assets/icons/peludinhos.svg" alt="Logo" class="h-6 w-auto brightness-0 invert">
                <h1 class="text-xl font-bold tracking-tight">Peludinhos</h1>
            </div>
            <button aria-label="Notificações" class="text-2xl p-1 relative">
                <i class="ri-notification-3-line"></i>
            </button>
        </div>
        <div class="flex items-center gap-3">
            <div class="relative flex-1">
                <input class="w-full pl-4 pr-10 py-3 rounded-xl text-gray-800 placeholder-gray-400 focus:outline-none border-none shadow-sm text-sm" placeholder="Buscar animais ou locais" type="text">
                <i class="ri-search-line absolute right-3 top-1/2 -translate-y-1/2 text-gray-400 text-lg"></i>
            </div>
            <button aria-label="Filtrar" class="bg-white p-3 rounded-xl text-gray-600 shadow-sm">
                <i class="ri-list-settings-line text-lg"></i>
            </button>
        </div>
    </header>

    <main class="flex-1 w-full relative -mt-16 px-4 z-10 pb-24">
        <!-- User Info Card -->
        <div class="bg-white rounded-3xl p-6 shadow-sm border border-gray-100 flex flex-col items-center relative mb-6">
            <img src="https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?ixlib=rb-4.0.3&auto=format&fit=crop&w=150&q=80" alt="Usuário" class="w-24 h-24 rounded-full object-cover border-4 border-white shadow-md -mt-16 bg-gray-200">
            <h2 class="text-xl font-bold text-gray-800 mt-3">João Silva</h2>
            <p class="text-sm text-gray-500 font-medium">joao.silva@email.com</p>
            <button class="mt-4 bg-brand-teal bg-opacity-10 text-teal-700 px-6 py-2 rounded-full text-sm font-bold border border-teal-100 hover:bg-opacity-20 transition">Editar Perfil</button>
        </div>

        <!-- Menu Options -->
        <div class="flex flex-col gap-3">
            <a href="#" class="bg-white p-4 rounded-2xl flex items-center justify-between shadow-sm border border-gray-50 hover:bg-gray-50 transition">
                <div class="flex items-center gap-4">
                    <div class="w-10 h-10 rounded-xl bg-orange-50 text-brand-orange flex items-center justify-center">
                        <i class="ri-bear-smile-fill text-xl"></i>
                    </div>
                    <span class="font-bold text-gray-700 text-sm">Meus Avistamentos</span>
                </div>
                <i class="ri-arrow-right-s-line text-gray-400 text-xl"></i>
            </a>

            <a href="#" class="bg-white p-4 rounded-2xl flex items-center justify-between shadow-sm border border-gray-50 hover:bg-gray-50 transition">
                <div class="flex items-center gap-4">
                    <div class="w-10 h-10 rounded-xl bg-red-50 text-red-500 flex items-center justify-center">
                        <i class="ri-megaphone-fill text-xl"></i>
                    </div>
                    <span class="font-bold text-gray-700 text-sm">Meus Anúncios (Perdidos)</span>
                </div>
                <i class="ri-arrow-right-s-line text-gray-400 text-xl"></i>
            </a>

            <a href="#" class="bg-white p-4 rounded-2xl flex items-center justify-between shadow-sm border border-gray-50 hover:bg-gray-50 transition">
                <div class="flex items-center gap-4">
                    <div class="w-10 h-10 rounded-xl bg-teal-50 text-brand-teal flex items-center justify-center">
                        <i class="ri-settings-4-fill text-xl"></i>
                    </div>
                    <span class="font-bold text-gray-700 text-sm">Configurações</span>
                </div>
                <i class="ri-arrow-right-s-line text-gray-400 text-xl"></i>
            </a>

            <a href="#" class="bg-white p-4 rounded-2xl flex items-center justify-between shadow-sm border border-gray-50 hover:bg-gray-50 transition">
                <div class="flex items-center gap-4">
                    <div class="w-10 h-10 rounded-xl bg-gray-50 text-gray-600 flex items-center justify-center">
                        <i class="ri-question-fill text-xl"></i>
                    </div>
                    <span class="font-bold text-gray-700 text-sm">Ajuda e Suporte</span>
                </div>
                <i class="ri-arrow-right-s-line text-gray-400 text-xl"></i>
            </a>

            <a href="../index.html" class="bg-white p-4 rounded-2xl flex items-center justify-between shadow-sm border border-red-50 hover:bg-red-50 transition mt-4">
                <div class="flex items-center gap-4">
                    <div class="w-10 h-10 rounded-xl bg-red-100 text-red-500 flex items-center justify-center">
                        <i class="ri-logout-box-r-line text-xl"></i>
                    </div>
                    <span class="font-bold text-red-600 text-sm">Sair da Conta</span>
                </div>
            </a>
        </div>
    </main>

    <!-- Bottom Navigation -->
    <nav class="fixed bottom-0 left-0 right-0 mx-auto w-full max-w-sm bg-white border-t border-gray-100 flex justify-around items-center py-2 px-4 pb-safe z-30 shadow-[0_-4px_10px_rgba(0,0,0,0.05)]">
        <a href="animais.html" class="flex flex-col items-center p-2 text-gray-400 hover:text-gray-600 transition-colors">
            <div class="mask-patinhas w-6 h-6 mb-1 bg-gray-400"></div>
            <span class="text-[10px] font-medium">Animais</span>
        </a>
        <a href="mapa.html" class="flex flex-col items-center p-2 text-gray-400 hover:text-gray-600 transition-colors">
            <i class="ri-map-pin-2-fill text-2xl"></i>
            <span class="text-[10px] font-medium mt-1">Mapa</span>
        </a>
        <a href="perdidos.html" class="flex flex-col items-center p-2 text-gray-400 hover:text-gray-600 transition-colors">
            <i class="ri-megaphone-fill text-2xl"></i>
            <span class="text-[10px] font-medium mt-1">Perdidos</span>
        </a>
        <a href="perfil.html" class="flex flex-col items-center p-2 text-brand-orange">
            <i class="ri-user-fill text-2xl"></i>
            <span class="text-[10px] font-medium mt-1">Perfil</span>
        </a>
    </nav>
    <style>
        .pb-safe {
            padding-bottom: env(safe-area-inset-bottom, 1rem);
        }
    </style>
  </div>
</body>
</html>
