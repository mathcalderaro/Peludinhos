<!DOCTYPE html>

<html lang="pt-BR">
<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Peludinhos - Mapa</title>

    <link
        href="https://fonts.googleapis.com"
        rel="preconnect"
    >

    <link
        crossorigin
        href="https://fonts.gstatic.com"
        rel="preconnect"
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
        rel="stylesheet"
    >

    <link
        rel="stylesheet"
        href="../css/output.css"
    >

    <link
        rel="stylesheet"
        href="../css/mapa.css"
    >

    <link
        rel="stylesheet"
        href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
        crossorigin=""
    >

    <link
        href="https://cdn.jsdelivr.net/npm/remixicon@4.2.0/fonts/remixicon.css"
        rel="stylesheet"
    >

    <!-- Página protegida: sem token (ou token vencido) → volta para o login -->
    <script src="../js/auth.js"></script>
    <script>exigirLogin();</script>

</head>

<body
    class="h-screen w-screen overflow-hidden flex flex-col font-sans relative bg-surface"
>

    <header
        class="bg-brand-teal text-white z-20 relative pt-12 pb-4 px-4 rounded-b-4x1 shadow-md flex flex-col gap-4"
    >

        <div class="flex items-center justify-between">

            <button
                aria-label="Menu"
                class="text-2xl p-1"
            >
                <i class="ri-menu-line"></i>
            </button>

            <div class="flex items-center gap-2">

                <i class="ri-map-pin-2-fill text-2xl"></i>

                <h1 class="text-xl font-bold tracking-tight">
                    Peludinhos
                </h1>

            </div>

            <div class="flex items-center gap-1">

                <button
                    aria-label="Notificações"
                    class="text-2xl p-1 relative"
                >
                    <i class="ri-notification-3-line"></i>
                </button>

                <a
                    href="perfil.html"
                    aria-label="Meu perfil"
                    title="Meu perfil"
                    class="text-2xl p-1"
                >
                    <i class="ri-user-3-line"></i>
                </a>

            </div>

        </div>

        <div class="flex items-center gap-3">

            <div class="relative flex-1">

                <input
                    class="w-full pl-4 pr-10 py-3 rounded-xl text-gray-800 placeholder-gray-400 focus:outline-none border-none shadow-sm text-sm"
                    placeholder="Buscar animais ou locais"
                    type="text"
                >

                <i
                    class="ri-search-line absolute right-3 top-1/2 -translate-y-1/2 text-gray-400 text-lg"
                ></i>

            </div>

            <button
                aria-label="Filtrar"
                class="bg-white p-3 rounded-xl text-gray-600 shadow-sm"
            >
                <i class="ri-list-settings-line text-lg"></i>
            </button>

        </div>

    </header>
        <main class="flex-1 relative z-10 -mt-8">

            <div id="map"></div>

        </main>

<script
    src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
    integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
    crossorigin=""
></script>

<script src="../js/mapa.js"></script>

</body>
</html>
